# Per-PR preview deployments.
#
# This workflow is OPT-IN. The boilerplate ships with placeholder wrangler
# IDs and no Cloudflare credentials, so previews stay off until you wire up
# your own account:
#
#   1. Set the repo VARIABLE `CLOUDFLARE_ACCOUNT_ID`
#      (Settings → Secrets and variables → Actions → Variables tab) to your
#      Cloudflare account ID.
#   2. Set the repo SECRET `CLOUDFLARE_API_TOKEN`
#      (same page → Secrets tab) to an API token created from the
#      "Edit Cloudflare Workers" template, with "D1:Edit" permission added
#      (the template alone can't run D1 migrations).
#
# Once both are set, every PR gets its own Worker version at a stable URL
# posted as a PR comment, backed by its own D1 database (provisioned here,
# deleted on close by preview-cleanup.yml). `bun run setup` provisions the
# rest of the `preview` environment (R2 + Worker) — see wrangler.jsonc's
# `env.preview` block.
#
# Two owner-run one-offs are NOT automated here, deliberately:
#
#   a. Each time a NEW Durable Object class is added to wrangler.jsonc, the
#      `preview` worker needs one real deploy — `bun run deploy:preview` —
#      before per-PR versions can be uploaded onto it. Cloudflare's docs are
#      explicit (https://developers.cloudflare.com/workers/versions-and-deployments/deployment-management/):
#        "Uploading a version that changes Durable Object class lifecycle is
#         not supported. This applies to both the declarative exports field and
#         the legacy migrations array - any change that creates, deletes,
#         renames, or transfers a Durable Object class must be applied through
#         wrangler deploy."
#      The reason is atomicity: a lifecycle change cannot be rolled back to a
#      version that predates it, so it cannot ride in an unactivated version.
#      The same page's "First upload" limit means a worker that has never been
#      deployed at all also cannot be created by `versions upload` — the one
#      bootstrap deploy below satisfies both limits at once.
#      THIS IS NOT A PERMANENT BREAK. It is one deploy per new DO class, not a
#      cost per PR. Wrangler only sends a `migrations` key while the deployed
#      script's migration tag is behind the config's last tag; once `v1` is
#      applied, `versions upload` sends nothing and every PR preview works
#      again — until someone adds a new migration tag, which needs another real
#      deploy. Do not conclude from a red preview job that previews are broken.
#      Note: `wrangler versions upload --dry-run` CANNOT catch this. Wrangler
#      resolves migrations only when not dry-running, and the rejection comes
#      from the API, so a green dry run proves nothing here.
#      The upload step below detects the failure and prints the remediation.
#   b. `ANTHROPIC_API_KEY` is a Worker SECRET, not a wrangler.jsonc binding, so
#      CI cannot set it (and should not — it would have to pass a key through a
#      workflow). Set it once per environment:
#        wrangler secret put ANTHROPIC_API_KEY --env preview
#      Its absence never breaks a deploy: BoardAgent constructs fine without a
#      key and only `board.generate` fails, with a typed ConfigurationError
#      (see app/services/board-agent.ts's `unconfiguredBoardAgent`).
#
# D1 migrations, by contrast, ARE automated — the "Migrate per-PR D1" step
# below runs the same command as `bun run db:migrate:preview`.
name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The job gate can only see the CLOUDFLARE_ACCOUNT_ID variable (secrets
      # aren't readable in job-level `if`), so verify the token separately.
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is set but the CLOUDFLARE_API_TOKEN secret is missing or empty. Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision per-PR D1
        run: bun scripts/ci/setup-preview-db.ts ${{ github.event.number }}

      - name: Migrate per-PR D1
        run: bunx wrangler d1 migrations apply DATABASE --env preview --remote

      - name: Seed per-PR D1
        run: bun scripts/seed-preview.ts --preview

      - name: Build (preview env)
        env:
          CLOUDFLARE_ENV: preview
        run: bun run build

      # No `--env preview` here on purpose: the build step above emits a
      # *redirected* config (`.wrangler/deploy/config.json` →
      # `build/server/wrangler.json`) in which CLOUDFLARE_ENV=preview has
      # already been flattened to the top level — worker `<name>-preview`, the
      # per-PR D1 patched in by setup-preview-db.ts, and the `migrations` list.
      # Passing `--env preview` would look for an `env.preview` key that the
      # flattened config no longer has.
      - name: Upload preview version
        id: upload
        run: |
          # The step used to run under `set -e` with the wrangler call inside a
          # command substitution, so a non-zero wrangler exit killed the step at
          # the assignment and `echo "$OUT"` never ran — every failure surfaced
          # as a bare "Process completed with exit code 1" with wrangler's real
          # error discarded. Capture the status, then echo BEFORE anything that
          # can exit.
          set +e
          OUT=$(bunx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"

          if [ "$STATUS" -ne 0 ]; then
            # A brand-new Durable Object class cannot be created by `versions
            # upload`: an uploaded version is deliberately NOT activated, and
            # Cloudflare only applies Durable Object migrations as part of a
            # real deploy. The preview worker therefore needs exactly one
            # bootstrap deploy before per-PR versions can be uploaded onto it.
            # The observed error, verbatim from the Cloudflare API on this repo's
            # run 30312668942 (job 90131510735):
            #
            #   Version upload failed. You attempted to upload a version of a
            #   Worker that includes a Durable Object migration, but migrations
            #   must be fully applied via a non-versioned deployment. Refer to
            #   the documentation for more information. [code: 10211]
            #
            # `10211` is therefore the precise signal. The word-level patterns
            # are kept alongside it as a hedge in case Cloudflare rewords or
            # renumbers; an unmatched failure still falls through to the generic
            # branch below, which prints wrangler's real output either way.
            if printf '%s' "$OUT" | grep -qiE '10211|migration|durable.object|new_sqlite_classes|new_classes'; then
              {
                echo "### Preview deploy blocked: Durable Object migration"
                echo
                echo "'wrangler versions upload' cannot create a **new** Durable Object class."
                echo "An uploaded version is never activated, and Cloudflare only applies"
                echo "Durable Object migrations during a real deploy — so the 'v1' /"
                echo "'new_sqlite_classes: [BoardRoom]' migration in wrangler.jsonc has"
                echo "nowhere to run."
                echo
                echo "**One-time fix — repo owner, run locally.** This job cannot do it:"
                echo "a real deploy against the live Cloudflare account is not CI's to make."
                echo
                echo '```bash'
                echo "bun run deploy:preview   # unblocks THIS job (applies tag v1 to flappyboard-preview)"
                echo "bun run deploy           # production worker — or just let deploy.yml do it on merge to main"
                echo '```'
                echo
                echo "After that single bootstrap, every PR's 'versions upload' succeeds:"
                echo "the DO class already exists on the worker, so wrangler sends no"
                echo "'migrations' key at all. **One-time cost per new DO class, not a"
                echo "per-PR cost** — a new migration tag would need another real deploy."
                echo
                echo "Reference: https://developers.cloudflare.com/workers/versions-and-deployments/deployment-management/"
                echo
                echo "Wrangler's full output is in the job log."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::[code 10211] This Worker has a pending Durable Object migration (tag v1, new_sqlite_classes: BoardRoom) and 'wrangler versions upload' cannot apply one — DO lifecycle changes are atomic, so they only apply via a real deploy. Fix ONCE: run 'bun run deploy:preview' (and 'bun run deploy' for production, or let deploy.yml do it on merge). Preview deploys then work normally until a new migration tag is added — this is not permanently broken. Docs: https://developers.cloudflare.com/workers/versions-and-deployments/deployment-management/ — wrangler's full output is above."
            else
              echo "::error::'wrangler versions upload' failed with exit status $STATUS. Wrangler's full output is above."
            fi
            exit "$STATUS"
          fi

          ALIAS_URL=$(printf '%s' "$OUT" | grep -oE 'Version Preview Alias URL: https://\S+' | awk '{print $NF}')
          VERSION_URL=$(printf '%s' "$OUT" | grep -oE 'Version Preview URL: https://\S+' | awk '{print $NF}')
          VERSION_ID=$(printf '%s' "$OUT" | grep -oE 'Worker Version ID: \S+' | awk '{print $NF}')

          {
            echo "alias_url=$ALIAS_URL"
            echo "version_url=$VERSION_URL"
            echo "version_id=$VERSION_ID"
          } >> "$GITHUB_OUTPUT"

          # A missing URL is NOT a failed deploy, and it used to be treated as
          # one: `exit 1` on an upload that had already succeeded. That turned
          # every PR red for days across four branches — `feat/brand-system`,
          # `chore/sync-template`, `feat/app-journey-v2`, `feat/front-door` —
          # while the worker itself uploaded fine every time. A check that is
          # always red teaches people to stop reading checks, which costs more
          # than the missing link does.
          #
          # By the time we reach here `wrangler versions upload` has exited 0:
          # the bundle is built, the assets are uploaded and the version exists
          # on the account. The only thing absent is a convenience URL, so this
          # warns and keeps going.
          #
          # Why it can be absent even with `preview_urls: true` (verified set,
          # both in wrangler.jsonc and in the generated build/server/wrangler.json
          # the upload actually uses): a preview URL hangs off the Worker's
          # workers.dev subdomain, and that subdomain is only provisioned by a
          # real `wrangler deploy`. A Worker that has only ever been
          # version-uploaded has nowhere to serve one from — the same one-time
          # bootstrap the Durable Object branch above describes, surfacing in a
          # second way now that the DO migration is applied.
          if [ -z "$ALIAS_URL" ] || [ -z "$VERSION_URL" ]; then
            {
              echo "### Preview uploaded, but no preview URL was returned"
              echo
              echo "\`wrangler versions upload\` **succeeded** — version \`${VERSION_ID:-unknown}\`"
              echo "is on the account. Wrangler printed no \`Version Preview URL\`, so there"
              echo "is no link to hand you."
              echo
              echo "Most likely cause: the \`flappyboard-preview\` Worker has no workers.dev"
              echo "subdomain yet. A preview URL is served from that subdomain, and only a"
              echo "real deploy provisions it — \`versions upload\` never can."
              echo
              echo "**One-time fix — repo owner, run locally.** CI does not make real"
              echo "deploys against the live account:"
              echo
              echo '```bash'
              echo "bun run deploy:preview"
              echo '```'
              echo
              echo "If that is already done, check that preview URLs are enabled for the"
              echo "Worker in the Cloudflare dashboard (Settings → Domains & Routes)."
              echo
              echo "This step no longer fails the job for a missing URL: the deploy worked,"
              echo "and only the convenience link is absent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Preview version ${VERSION_ID:-unknown} uploaded successfully, but wrangler returned no preview URL — the preview Worker most likely has no workers.dev subdomain yet. One-time fix: 'bun run deploy:preview'. Not failing the job, because the deploy itself succeeded."
          fi

      # The seed summary comes from the seed script itself (--describe), so
      # extending fixtures in scripts/seed-preview.ts automatically updates
      # every future PR comment — no workflow edit needed.
      - name: Compose PR comment
        run: |
          {
            echo "### Preview deployment"
            echo
            # The URL branch, because a comment reading "**</>**" with an empty
            # bold and a dangling "Per-commit version:" is worse than saying
            # plainly that there is no link. See the upload step for why a URL
            # can be missing on a deploy that succeeded.
            if [ -n "${{ steps.upload.outputs.alias_url }}" ]; then
              echo "**${{ steps.upload.outputs.alias_url }}**"
              echo
              echo "Per-commit version: ${{ steps.upload.outputs.version_url }}"
            else
              echo "Version \`${{ steps.upload.outputs.version_id }}\` uploaded — but"
              echo "wrangler returned no preview URL, so there is no link to open."
              echo "The \`flappyboard-preview\` Worker most likely has no workers.dev"
              echo "subdomain yet; only a real deploy provisions one. One-time fix,"
              echo "run locally: \`bun run deploy:preview\`."
            fi
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "Data: this PR gets its **own D1 database** (created when the PR"
            echo "opens, deleted when it closes). The preview R2 bucket is shared"
            echo "across all PR previews."
            echo
            bun scripts/seed-preview.ts --describe
            echo
            echo "No manual teardown needed — uploaded versions age out on their"
            echo "own, and the per-PR database is deleted on close by"
            echo "\`preview-cleanup.yml\`."
          } > "$RUNNER_TEMP/preview-comment.md"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          path: ${{ runner.temp }}/preview-comment.md
