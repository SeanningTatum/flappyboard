<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1390" viewBox="0 0 900 1390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>.mono{font-size:13px;white-space:pre}</style>
  <rect width="900" height="1390" rx="10" fill="#1e2127"/>
